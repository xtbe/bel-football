[project]
name = "bel-football"
version = "0.1.0"
description = "Python client for a local football API: Jupiler Pro League standings and fuzzy Belgian club-name resolution."
readme = "README.md"
requires-python = ">=3.13"
license="MIT"
license-files=["LICENSE"]
authors = [
    { name = "Tom Coudyzer", email = "tom@tcrscorner.com" }
]
keywords = ["football", "soccer", "jupiler-pro-league", "belgium", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
   "httpx>=0.28",
]

[project.urls]
Homepage = "https://github.com/xtbe/bel-football"
Repository = "https://github.com/xtbe/bel-football"
Issues = "https://github.com/xtbe/bel-football/issues"

# Dev-only tools — NOT installed for consumers, only for `uv sync` in this repo.
[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.22",
    "ruff>=0.9",
]

# --- build backend: hatchling ---
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bel_football"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# E/F = pycodestyle+pyflakes, I = import sorting, UP = pyupgrade,
# B = bug-bear, SIM = simplify.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]


